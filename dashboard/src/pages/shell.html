<!doctype html>
<html lang="{{LANG_HTML}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="alternate" hreflang="{{OTHER_LANG}}" href="{{HREF_LANG}}">
<script>try{var t=localStorage.getItem('atlas-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;500;600&family=Source+Code+Pro:wght@400;500&family=Noto+Serif+SC:wght@600&display=swap">
<link rel="stylesheet" href="{{A}}app.css">
</head>
<body data-page="{{PAGE}}" data-main="{{HREF_MAIN}}" data-safety="{{HREF_SAFETY}}">
<div class="hover-zone" aria-hidden="true"></div>
<div class="progress" id="progress" aria-hidden="true"></div>
<header class="topbar" id="topbar">
  <div class="in">
    <a class="brand" href="{{HREF_MAIN}}">{{t:site}}</a>
    <nav class="pages" aria-label="{{t:site}}">
      <a href="{{HREF_MAIN}}" class="{{ON_MAIN}}">{{t:navMain}}</a>
      <a href="{{HREF_SAFETY}}" class="{{ON_SAFETY}}">{{t:navSafety}}</a>
    </nav>
    <div class="tools">
      <a class="tbtn" id="langBtn" href="{{HREF_LANG}}" hreflang="{{OTHER_LANG}}" title="{{t:switchLang}}" aria-label="{{t:switchLang}}">{{t:langLabel}}</a>
      <button class="tbtn" id="themeBtn" type="button" title="{{t:toggleTheme}}" aria-label="{{t:toggleTheme}}">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</header>
{{BODY}}
<footer class="foot wrap" id="foot"></footer>
<div class="tip" id="tip" role="tooltip"></div>
<script src="{{A}}core.js"></script>
<script src="{{A}}text.{{LANG}}.js"></script>
{{EXTRA_SCRIPTS}}
<script src="{{A}}app.js"></script>
</body>
</html>
